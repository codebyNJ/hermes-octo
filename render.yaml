services:
  - type: web
    name: hermes
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_SERVER_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_SERVER_CORS_ORIGINS
        value: https://hermes.nijeeshnj.tech
      - key: CACHE_ENABLED
        value: "false"
