[supervisord]
nodaemon=true
user=root
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[program:honcho-api]
command=/opt/honcho/.venv/bin/python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 --log-level info
directory=/opt/honcho
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
priority=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
environment=PYTHONUNBUFFERED=1

[program:honcho-deriver]
command=/opt/honcho/.venv/bin/python -m src.deriver
directory=/opt/honcho
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
priority=20
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED=1

[program:hermes-gateway]
command=/usr/local/bin/hermes gateway
directory=/root
autostart=true
autorestart=true
startretries=5
startsecs=10
stopwaitsecs=10
priority=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED=1,HERMES_HOME="/root/.hermes",HERMES_LOG_LEVEL=INFO,LOG_LEVEL=INFO,GATEWAY_ALLOW_ALL_USERS=true

[program:llama-server]
command=/opt/llama-server/.venv/bin/python -m llama_cpp.server --model /opt/models/xLAM-1b-fc-r.Q4_K_M.gguf --host 127.0.0.1 --port 8080 --n_ctx 8192 --n_threads 2 --n_threads_batch 2 --n_batch 512 --n_ubatch 128 --use_mmap true --use_mlock false --chat_format chatml-function-calling --verbose false
directory=/opt/llama-server
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=15
priority=40
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED=1

[group:hermes-stack]
programs=honcho-api,honcho-deriver,hermes-gateway,llama-server
