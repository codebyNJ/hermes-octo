[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:honcho-api]
command=/opt/honcho/.venv/bin/python -m src.main
directory=/opt/honcho
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
priority=10
stdout_logfile=/var/log/honcho/api.log
stderr_logfile=/var/log/honcho/api.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED=1

[program:honcho-deriver]
command=/opt/honcho/.venv/bin/python -m src.deriver
directory=/opt/honcho
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
priority=20
stdout_logfile=/var/log/honcho/deriver.log
stderr_logfile=/var/log/honcho/deriver.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED=1

[program:hermes-gateway]
command=/usr/local/bin/hermes gateway
directory=/root
autostart=true
autorestart=true
startretries=5
startsecs=10
stopwaitsecs=10
priority=30
stdout_logfile=/var/log/hermes/gateway.log
stderr_logfile=/var/log/hermes/gateway.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED=1,HERMES_HOME="/root/.hermes"

[group:hermes-stack]
programs=honcho-api,honcho-deriver,hermes-gateway
