provider: "custom:groq"

custom_providers:
  - name: groq
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY

model:
  default: llama-3.3-70b-versatile

context_length: 32768
max_tokens: 4096

honcho:
  enabled: true

browser:
  enabled: false

stt:
  provider: "local"
  enabled: false

streaming:
  enabled: false

memory:
  enabled: true

agent:
  max_turns: 25
