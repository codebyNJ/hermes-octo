provider: "custom:zai"

custom_providers:
  - name: zai
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
  - name: groq
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  - name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
  - name: local
    base_url: http://127.0.0.1:8080/v1
    key_env: LLAMA_LOCAL_API_KEY

model:
  default: glm-4.7-flash

fallback_providers:
  - provider: custom:zai
    model: glm-4.7-flash
  - provider: custom:groq
    model: llama-3.3-70b-versatile
  - provider: custom:gemini
    model: gemini-2.0-flash-exp
  - provider: custom:gemini
    model: gemini-1.5-flash
  - provider: custom:openrouter
    model: meta-llama/llama-3.3-70b-instruct:free
  - provider: custom:local
    model: xlam-1b-fc-r

context_length: 128000
max_tokens: 8192

honcho:
  enabled: true

browser:
  enabled: true

computer:
  enabled: false

stt:
  provider: "local"
  enabled: false

tts:
  enabled: false

skills:
  enabled: false

streaming:
  enabled: true

memory:
  enabled: true

agent:
  max_turns: 10
  api_max_retries: 1
  disabled_toolsets:
    - cronjob
    - delegation
    - spotify
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - computer_use
    - image_gen
    - video_gen
    - kanban
    - moa
    - terminal
    - tts
    - vision
    - video
    - yuanbao
    - clarify
